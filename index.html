<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Incremental Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <h1>Incremental Clicker</h1>
    <div class="stats">
      <div>Coins: <span id="coins">0</span></div>
      <div>Coins/sec: <span id="cps">0</span></div>
    </div>
    <button id="clicker" class="big">Click me</button>

    <section class="upgrades">
      <h2>Upgrades</h2>
      <div id="upgrades"></div>
    </section>

    <div class="controls">
      <button id="save">Save</button>
      <button id="reset">Reset</button>
    </div>

    <footer>
      <small>Starter by kchends — autosaves to localStorage.</small>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
